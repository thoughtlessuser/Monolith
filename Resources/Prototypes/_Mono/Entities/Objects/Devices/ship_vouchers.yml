#Notes: all of tier 3 LPCs have their own vouchers with their own unique costs. All tier 2 capital/commander ships have their own LPC and unique cost.

#LPC base (just different sprites)
- type: entity
  abstract: true
  parent: BaseShipVoucher
  id: BaseShipLPC
  name: ship LPC
  description: Contains the necessary data for a shipyard console to produce a certain design.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Misc/lpc.rsi

#Ussp

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherUSSPBasic
  name: USSP basic shuttle LPC
  description: A small card that authorizes the acquisition of a basic USSP shuttle.
  components:
  - type: Sprite
    layers:
    - state: ltech
    - state: stripeussp
    - state: icon1
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: USSP
    companyName: USSP
    vessels:
    - Gadyuka
    - Gruznyk
    - Natisk
    - Strayk

