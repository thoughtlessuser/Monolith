# ussp end / tsfmc start

- type: entity
  parent: ShipVoucherNfsdBailiff
  id: ShipVoucherTsfmcColonel
  name: TSFMC colonel ship voucher
  description: Allows for one TSFMC ship purchase of any size, and allows for the procurement of a Polaris. Destroyed on sale.
  components:
  - type: ShipyardVoucher
    redemptionsLeft: 1
    access: # note - removed HOS/colonel access to prevent free flyssa (its only ship that uses HOS access, so it should be fine)
    - Armory
    - Sergeant
    - Bailiff
    - Security
    vessels:
    - PolarisShip
    accessGroups:
    - GeneralNfsdAccess

- type: entity
  parent: BaseShipLPC
  id: ShipVoucherFlyssa
  name: TSF flyssa LPC
  description: A small card that contains the data for the procurement of a Flyssa-class destroyer from the flagship's reserves.
  components:
  - type: Sprite
    layers:
    - state: htech
    - state: stripetsfmc
    - state: vouchermilitary
  - type: ShipyardVoucher
    destroyOnEmpty: true
    consoleType: Security
    companyName: TSF
    vessels:
    - Flyssa
  - type: StaticPrice
    vendPrice: 500000

