- type: entity
  name: forboding pinpointer
  description: A pinpointer with a scratched message on its' back panel; "BEWARE."
  id: PinpointerADSDungeon
  parent: PinpointerBase
  suffix: NuADDepot
  components:
  - type: Pinpointer
    component: NuADDepot
    targetName: unknown
  - type: Sprite
    layers:
    - state: pinpointer-station
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer-station
